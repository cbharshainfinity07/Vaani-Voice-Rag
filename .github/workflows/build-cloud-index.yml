name: Build cloud demo index

on:
  workflow_dispatch:
    inputs:
      rows_per_language:
        description: "Rows from each MSMARCO-XI language"
        required: true
        default: "100"
        type: string
      language_configs:
        description: "Space-separated list of MSMARCO-XI configs (e.g. 'hi mr kn te')"
        required: true
        default: "hi mr kn te"
        type: string

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      QDRANT_BATCH_SIZE: "16"
      QDRANT_TIMEOUT_S: "300"
      HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install production dependencies
        run: python -m pip install -e ".[production]"

      - name: Build selected-language cloud index
        run: >-
          python scripts/ingest.py
          --dataset ai4bharat/MSMARCO-XI
          --configs ${{ inputs.language_configs }}
          --split validation
          --limit "${{ inputs.rows_per_language }}"
          --backend sentence-transformers
          --model intfloat/multilingual-e5-small
          --vector-backend qdrant
          --qdrant-collection voice_rag_demo
          --qdrant-recreate
          --batch-size 16
          --eval-queries benchmarks/msmarco_xi_eval.jsonl
          --eval-count 500
          --out-index storage/cloud-index.json

      - name: Upload index manifest and evaluation queries
        uses: actions/upload-artifact@v4
        with:
          name: cloud-index-manifest
          path: |
            storage/cloud-index.manifest.json
            benchmarks/msmarco_xi_eval.jsonl
